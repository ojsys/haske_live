{% load static %}
<section class="section">
  <div class="container">
    {% if section.title or section.subtitle %}
    <div class="section-header center" data-animate>
      {% if section.subtitle %}<span class="section-eyebrow">{{ section.subtitle }}</span>{% endif %}
      {% if section.title %}<h2>{{ section.title }}</h2><div class="divider center"></div>{% endif %}
    </div>
    {% endif %}
    <div class="row g-4">
      {% for member in board_members %}
      <div class="col-6 col-md-4 col-lg-3" data-animate data-animate-delay="{{ forloop.counter }}">
        <div class="team-card">
          <div class="tc-avatar">
            <img src="{{ member.image.url }}" alt="{{ member.name }}" loading="lazy">
          </div>
          <div class="tc-info">
            <div class="tc-name">{{ member.name }}</div>
            <div class="tc-role">{{ member.position }}</div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
