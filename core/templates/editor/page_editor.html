<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editing — {{ page.title }} | HASKE Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Quill rich text editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<!-- SortableJS for drag-and-drop -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1825;--surface:#14253d;--surface-2:#1a2e47;--surface-3:#1f3553;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);
  --gold:#C8922A;--gold-dim:#b8821f;--green:#1D6A4A;--red:#e74c3c;
  --text:#dde6f0;--text-muted:#6e8caa;--text-dim:#4a6480;
  --sidebar-w:280px;--settings-w:300px;
  --radius:8px;--radius-lg:12px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

/* ======== TOP BAR ======== */
.topbar{height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;flex-shrink:0;z-index:50}
.topbar-back{color:var(--text-muted);text-decoration:none;font-size:.82rem;display:flex;align-items:center;gap:.4rem;transition:color .15s;padding:.35rem .6rem;border-radius:6px}
.topbar-back:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.topbar-sep{width:1px;height:22px;background:var(--border-2)}
.topbar-title{font-size:.9rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:.6rem;margin-left:auto}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;font-family:inherit;white-space:nowrap}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-dim);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border-2)}.btn-outline:hover{background:rgba(255,255,255,0.04)}
.btn-ghost{background:transparent;color:var(--text-muted)}.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(231,76,60,.25)}.btn-danger:hover{background:rgba(231,76,60,.08)}
.btn-sm{padding:.3rem .65rem;font-size:.74rem}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:6px}
.btn-publish{background:rgba(29,106,74,.2);color:#4dba87;border:1px solid rgba(29,106,74,.3)}.btn-publish:hover{background:rgba(29,106,74,.3)}
.btn-draft{background:rgba(200,146,42,.15);color:var(--gold);border:1px solid rgba(200,146,42,.3)}.btn-draft:hover{background:rgba(200,146,42,.25)}

/* ======== LAYOUT ======== */
.editor-layout{flex:1;display:flex;overflow:hidden}

/* ======== LEFT SIDEBAR — Sections List ======== */
.ed-sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.ed-sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.ed-tab{flex:1;padding:.7rem .5rem;text-align:center;font-size:.77rem;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.03em;text-transform:uppercase}
.ed-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.ed-tab-content{flex:1;overflow-y:auto;display:none}
.ed-tab-content.active{display:flex;flex-direction:column}

/* Section list */
.sections-toolbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sections-toolbar span{font-size:.77rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.section-item{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;user-select:none;position:relative}
.section-item:hover{background:rgba(255,255,255,0.03)}
.section-item.active{background:rgba(200,146,42,.1);border-left:2px solid var(--gold)}
.section-item.active .si-name{color:var(--text)}
.drag-handle{color:var(--text-dim);cursor:grab;font-size:.75rem;flex-shrink:0;padding:.2rem}
.drag-handle:active{cursor:grabbing}
.si-type-badge{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.si-name{flex:1;font-size:.81rem;font-weight:500;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-actions{display:flex;gap:.25rem;flex-shrink:0;opacity:0;transition:opacity .12s}
.section-item:hover .si-actions,.section-item.active .si-actions{opacity:1}
.si-btn{width:24px;height:24px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.72rem;transition:all .12s}
.si-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.si-btn.danger:hover{background:rgba(231,76,60,.15);color:var(--red)}
.si-btn.hidden-btn{color:var(--text-dim);opacity:.5}
.sections-empty{padding:1.5rem 1rem;text-align:center;color:var(--text-dim);font-size:.8rem}
.sections-empty i{display:block;font-size:1.8rem;margin-bottom:.75rem;opacity:.3}

/* Page settings tab */
.settings-form{padding:1rem;display:flex;flex-direction:column;gap:.9rem}
.fgroup label{display:block;font-size:.72rem;font-weight:600;color:var(--text-muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
.fgroup input,.fgroup textarea,.fgroup select{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:6px;padding:.5rem .7rem;color:var(--text);font-family:inherit;font-size:.82rem;outline:none;transition:border-color .15s;resize:vertical}
.fgroup input:focus,.fgroup textarea:focus,.fgroup select:focus{border-color:var(--gold)}
.fgroup select option{background:var(--surface-2)}
.fgroup-row{display:flex;gap:.75rem}
.fgroup-row .fgroup{flex:1}
.toggle-row{display:flex;align-items:center;gap:.75rem}
.toggle-row label:first-child{flex:1;font-size:.82rem;font-weight:500;color:var(--text)}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.15);border-radius:22px;transition:.2s}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked + .toggle-slider{background:var(--green)}
.toggle input:checked + .toggle-slider::before{transform:translateX(18px)}
.img-upload-area{border:1.5px dashed var(--border-2);border-radius:8px;padding:1rem;text-align:center;cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden}
.img-upload-area:hover{border-color:var(--gold)}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload-area img{width:100%;max-height:120px;object-fit:cover;border-radius:6px;display:block}
.img-upload-placeholder{color:var(--text-dim);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.5rem 0}
.img-upload-placeholder i{font-size:1.5rem;opacity:.4}
.img-remove-btn{display:block;margin-top:.5rem;font-size:.74rem;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit}
.save-settings-btn{margin-top:.25rem}

/* ======== MAIN AREA ======== */
.ed-main{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}

/* Empty state */
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);text-align:center;padding:3rem}
.main-empty i{font-size:3rem;margin-bottom:1.25rem;opacity:.2}
.main-empty p{font-size:.88rem;margin-bottom:1.5rem}

/* Section editor */
.section-editor{padding:1.75rem 2rem;max-width:800px;width:100%}
.sec-editor-header{display:flex;align-items:center;gap:.875rem;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.sec-editor-type{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.sec-editor-type .type-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.sec-editor-actions{margin-left:auto;display:flex;gap:.6rem}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.field-grid.col-1{grid-template-columns:1fr}
.field-full{grid-column:1/-1}
.fgroup{margin-bottom:0}
.fgroup.mb{margin-bottom:1rem}
.fgroup label{display:block;font-size:.73rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em}
.fgroup .field-hint{font-size:.68rem;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;margin-left:.3rem}
.fgroup input,.fgroup textarea,.fgroup select{width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:7px;padding:.55rem .8rem;color:var(--text);font-family:inherit;font-size:.85rem;outline:none;transition:border-color .15s;resize:vertical}
.fgroup input:focus,.fgroup textarea:focus,.fgroup select:focus{border-color:var(--gold)}
.fgroup select option{background:var(--surface-2)}

/* Background picker */
.bg-picker{display:flex;gap:.5rem;flex-wrap:wrap}
.bg-option{position:relative;cursor:pointer}
.bg-option input{position:absolute;opacity:0;width:0;height:0}
.bg-swatch{width:32px;height:32px;border-radius:6px;display:block;border:2px solid transparent;transition:all .15s}
.bg-option input:checked + .bg-swatch{border-color:var(--gold);transform:scale(1.1)}
.bg-swatch-white{background:#fff}.bg-swatch-cream{background:#FAF8F3}.bg-swatch-gray{background:#e8ecef}
.bg-swatch-navy{background:#0B1F3A}.bg-swatch-gold{background:#C8922A}.bg-swatch-green{background:#1D6A4A}

/* Quill override */
.ql-toolbar.ql-snow{background:var(--surface-2);border:1px solid var(--border-2);border-radius:7px 7px 0 0}
.ql-container.ql-snow{border:1px solid var(--border-2);border-top:none;border-radius:0 0 7px 7px;background:var(--surface);min-height:120px}
.ql-editor{color:var(--text);font-family:'Inter',sans-serif;font-size:.875rem}
.ql-editor.ql-blank::before{color:var(--text-dim)}
.ql-snow .ql-stroke{stroke:var(--text-muted)}.ql-snow .ql-fill{fill:var(--text-muted)}
.ql-snow .ql-picker{color:var(--text-muted)}.ql-snow .ql-picker-options{background:var(--surface-2);border:1px solid var(--border-2)}
.ql-snow.ql-toolbar button:hover .ql-stroke,.ql-snow .ql-toolbar button.ql-active .ql-stroke{stroke:var(--gold)}

/* Image upload in section editor */
.img-field-wrap{display:flex;gap:1rem;align-items:flex-start}
.img-field-thumb{width:90px;height:70px;border-radius:7px;object-fit:cover;border:1px solid var(--border-2);flex-shrink:0}
.img-field-thumb.placeholder{background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:1.2rem}
.img-field-controls{flex:1;display:flex;flex-direction:column;gap:.45rem}
.img-file-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:6px;font-size:.77rem;font-weight:500;cursor:pointer;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);font-family:inherit;transition:all .15s;position:relative;overflow:hidden}
.img-file-btn:hover{border-color:var(--gold)}
.img-file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-remove-link{font-size:.74rem;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit;text-align:left}

/* Section divider */
.sec-divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0}

/* Cards manager */
.cards-section{margin-top:1.5rem}
.cards-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cards-section-head h4{font-size:.85rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.card-item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:1rem;margin-bottom:.75rem;position:relative}
.card-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;cursor:pointer}
.card-item-header span{font-size:.83rem;font-weight:600}
.card-item-toggle{color:var(--text-muted);background:none;border:none;cursor:pointer;font-size:.75rem;transition:transform .2s;color:var(--text-muted)}
.card-item-body{display:none}
.card-item-body.open{display:block}
.card-delete-btn{color:var(--red);background:none;border:none;cursor:pointer;font-size:.75rem;padding:.2rem .4rem;border-radius:4px;transition:background .12s}
.card-delete-btn:hover{background:rgba(231,76,60,.1)}

/* Section type modal */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.type-option{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:1rem .75rem;text-align:center;cursor:pointer;transition:all .15s}
.type-option:hover{border-color:var(--gold);background:rgba(200,146,42,.07)}
.type-option .to-icon{width:38px;height:38px;border-radius:8px;margin:0 auto .6rem;display:flex;align-items:center;justify-content:center;font-size:1rem}
.type-option .to-label{font-size:.75rem;font-weight:600;color:var(--text-muted)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-lg);padding:1.75rem;width:100%;max-width:520px;transform:translateY(20px);transition:transform .25s;max-height:80vh;overflow-y:auto}
.overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:1rem;font-weight:600;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:.2rem;transition:color .12s}
.modal-close:hover{color:var(--text)}

/* Toast */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;padding:.75rem 1.1rem;font-size:.82rem;z-index:1000;display:flex;align-items:center;gap:.5rem;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;max-width:280px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(29,106,74,.6);}.toast.success::before{content:'✓';color:#4dba87;font-weight:700;margin-right:.2rem}
.toast.error{border-color:rgba(231,76,60,.5)}.toast.error::before{content:'✕';color:var(--red);font-weight:700;margin-right:.2rem}

/* Spinner */
.spin{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<header class="topbar">
  <a href="/editor/" class="topbar-back"><i class="fas fa-chevron-left"></i> Pages</a>
  <div class="topbar-sep"></div>
  <span class="topbar-title" id="topbar-title">{{ page.title }}</span>
  <div class="topbar-right">
    {% if page.is_published %}
      <button class="btn btn-publish btn-sm" id="btn-publish" onclick="togglePublish()">
        <i class="fas fa-circle" style="font-size:.5rem"></i> Published
      </button>
    {% else %}
      <button class="btn btn-draft btn-sm" id="btn-publish" onclick="togglePublish()">
        <i class="fas fa-circle" style="font-size:.5rem"></i> Draft
      </button>
    {% endif %}
    <a href="/pages/{{ page.slug }}/" target="_blank" class="btn btn-ghost btn-sm">
      <i class="fas fa-eye"></i> Preview
    </a>
    <button class="btn btn-gold" onclick="saveCurrentSection()" id="btn-save">
      <i class="fas fa-save"></i> Save
    </button>
  </div>
</header>

<!-- ===== LAYOUT ===== -->
<div class="editor-layout">

  <!-- ===== LEFT SIDEBAR ===== -->
  <aside class="ed-sidebar">
    <div class="ed-sidebar-tabs">
      <div class="ed-tab active" data-tab="sections" onclick="switchTab('sections')">Sections</div>
      <div class="ed-tab" data-tab="settings" onclick="switchTab('settings')">Page Settings</div>
    </div>

    <!-- SECTIONS TAB -->
    <div class="ed-tab-content active" id="tab-sections">
      <div class="sections-toolbar">
        <span>Content Blocks</span>
        <button class="btn btn-gold btn-sm" onclick="openAddSection()">
          <i class="fas fa-plus"></i> Add
        </button>
      </div>
      <div id="sections-list"></div>
    </div>

    <!-- PAGE SETTINGS TAB -->
    <div class="ed-tab-content" id="tab-settings">
      <div class="settings-form">
        <div class="fgroup">
          <label>Page Title</label>
          <input type="text" id="ps-title" value="{{ page.title }}">
        </div>
        <div class="fgroup">
          <label>Nav Label <span class="field-hint">shown in menu</span></label>
          <input type="text" id="ps-nav-label" value="{{ page.nav_label }}" placeholder="Leave blank to use title">
        </div>
        <div class="fgroup">
          <label>URL Slug</label>
          <input type="text" id="ps-slug" value="{{ page.slug }}">
        </div>
        <div class="fgroup">
          <label>Meta Description</label>
          <textarea id="ps-meta" rows="3" placeholder="SEO description...">{{ page.meta_description }}</textarea>
        </div>

        <div class="fgroup">
          <label>Header / Banner Image</label>
          <div class="img-upload-area" id="ps-img-area">
            {% if page.header_image %}
              <img src="{{ page.header_image.url }}" id="ps-img-preview" alt="">
              <input type="file" id="ps-header-image" accept="image/*" onchange="previewSettingsImage(this)">
              <button class="img-remove-btn" onclick="removePageHeaderImage()">Remove image</button>
            {% else %}
              <input type="file" id="ps-header-image" accept="image/*" onchange="previewSettingsImage(this)">
              <div class="img-upload-placeholder">
                <i class="fas fa-image"></i>
                <span>Click to upload banner image</span>
              </div>
            {% endif %}
          </div>
        </div>

        <div class="fgroup">
          <label>Navigation Order</label>
          <input type="number" id="ps-nav-order" value="{{ page.nav_order }}" min="0">
        </div>

        <div class="toggle-row fgroup">
          <label>Show in Navigation</label>
          <label class="toggle">
            <input type="checkbox" id="ps-show-nav" {% if page.show_in_nav %}checked{% endif %}>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <button class="btn btn-gold save-settings-btn" onclick="savePageSettings()">
          <i class="fas fa-save"></i> Save Settings
        </button>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN EDITOR AREA ===== -->
  <main class="ed-main" id="ed-main">
    <div class="main-empty" id="main-empty">
      <i class="fas fa-mouse-pointer"></i>
      <p>Select a section from the left to edit it,<br>or click <strong>+ Add</strong> to create one.</p>
      <button class="btn btn-gold" onclick="openAddSection()"><i class="fas fa-plus"></i> Add First Section</button>
    </div>
    <div class="section-editor" id="section-editor" style="display:none;"></div>
  </main>

</div>

<!-- ===== ADD SECTION MODAL ===== -->
<div class="overlay" id="modal-add-section" onclick="closeAddSection(event)">
  <div class="modal">
    <div class="modal-title">
      Choose Section Type
      <button class="modal-close" onclick="document.getElementById('modal-add-section').classList.remove('open')">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="type-grid" id="type-grid"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
// ----------------------------------------------------------------
//  Initial data
// ----------------------------------------------------------------
const PAGE_ID    = {{ page.id }};
const CSRF       = '{{ csrf_token }}';
const INIT_SECTIONS = {{ sections_json|safe }};

const SECTION_TYPES = [
  {% for val, label in section_types %}
  { val: "{{ val }}", label: "{{ label }}" },
  {% endfor %}
];
const BG_CHOICES = [
  {% for val, label in background_choices %}
  { val: "{{ val }}", label: "{{ label }}" },
  {% endfor %}
];
const IMG_POSITIONS = [
  {% for val, label in image_positions %}
  { val: "{{ val }}", label: "{{ label }}" },
  {% endfor %}
];

const TYPE_ICONS = {
  hero: 'fa-mountain', text: 'fa-align-left', image_text: 'fa-columns',
  cards: 'fa-th-large', stats: 'fa-chart-bar', cta: 'fa-bullhorn',
  gallery: 'fa-images', video: 'fa-play-circle', team: 'fa-users',
  newsletter: 'fa-envelope', map: 'fa-map-marked-alt', accordion: 'fa-list',
};
const TYPE_COLORS = {
  hero: '#C8922A', text: '#3498db', image_text: '#9b59b6',
  cards: '#1abc9c', stats: '#e67e22', cta: '#e74c3c',
  gallery: '#2ecc71', video: '#e74c3c', team: '#3498db',
  newsletter: '#1D6A4A', map: '#27ae60', accordion: '#95a5a6',
};

// ----------------------------------------------------------------
//  State
// ----------------------------------------------------------------
let sections = JSON.parse(JSON.stringify(INIT_SECTIONS));
let activeSectionId = null;
let quillInstance = null;
let isPublished = {{ page.is_published|yesno:"true,false" }};

// ----------------------------------------------------------------
//  Tab switching
// ----------------------------------------------------------------
function switchTab(tab) {
  document.querySelectorAll('.ed-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.ed-tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${tab}`));
}

// ----------------------------------------------------------------
//  Render sections list
// ----------------------------------------------------------------
function renderSectionsList() {
  const list = document.getElementById('sections-list');
  list.innerHTML = '';

  if (!sections.length) {
    list.innerHTML = `<div class="sections-empty"><i class="fas fa-th-list"></i>No sections yet.<br>Click + Add to start.</div>`;
    return;
  }

  sections.slice().sort((a, b) => a.order - b.order).forEach(s => {
    const el = document.createElement('div');
    el.className = `section-item${activeSectionId === s.id ? ' active' : ''}`;
    el.dataset.id = s.id;
    const icon = TYPE_ICONS[s.section_type] || 'fa-square';
    const color = TYPE_COLORS[s.section_type] || '#888';
    el.innerHTML = `
      <span class="drag-handle" title="Drag to reorder"><i class="fas fa-grip-vertical"></i></span>
      <span class="si-type-badge" style="background:${color}20;color:${color}"><i class="fas ${icon}"></i></span>
      <span class="si-name">${esc(s.title || s.section_type_display)}</span>
      <div class="si-actions">
        <button class="si-btn${s.is_visible ? '' : ' hidden-btn'}" title="${s.is_visible ? 'Visible — click to hide' : 'Hidden — click to show'}" onclick="toggleVisibility(${s.id}, event)">
          <i class="fas fa-eye${s.is_visible ? '' : '-slash'}"></i>
        </button>
        <button class="si-btn danger" title="Delete section" onclick="confirmDelete(${s.id}, event)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    `;
    el.addEventListener('click', () => selectSection(s.id));
    list.appendChild(el);
  });

  // Init drag-and-drop
  Sortable.create(list, {
    handle: '.drag-handle',
    animation: 150,
    onEnd(evt) {
      const ids = [...list.querySelectorAll('.section-item')].map((el, i) => ({
        id: parseInt(el.dataset.id), order: i
      }));
      ids.forEach(item => {
        const s = sections.find(x => x.id === item.id);
        if (s) s.order = item.order;
      });
      fetch(`/editor/api/pages/${PAGE_ID}/reorder/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
        body: JSON.stringify(ids),
      }).catch(() => toast('Reorder failed', 'error'));
    },
  });
}

// ----------------------------------------------------------------
//  Select section → show editor
// ----------------------------------------------------------------
function selectSection(id) {
  if (activeSectionId === id) return;
  activeSectionId = id;
  renderSectionsList();
  const s = sections.find(x => x.id === id);
  if (s) renderSectionEditor(s);
}

function saveCurrentSection() {
  if (activeSectionId) {
    saveSectionById(activeSectionId);
  } else {
    savePageSettings();
  }
}

// ----------------------------------------------------------------
//  Section editor
// ----------------------------------------------------------------
function renderSectionEditor(s) {
  document.getElementById('main-empty').style.display = 'none';
  const panel = document.getElementById('section-editor');
  panel.style.display = 'block';

  const icon = TYPE_ICONS[s.section_type] || 'fa-square';
  const color = TYPE_COLORS[s.section_type] || '#888';

  // Build HTML skeleton (no user content injected via innerHTML)
  panel.innerHTML = `
    <div class="sec-editor-header">
      <div class="sec-editor-type">
        <span class="type-icon" style="background:${color}20;color:${color}"><i class="fas ${icon}"></i></span>
        ${s.section_type_display}
      </div>
      <div class="sec-editor-actions">
        <button class="btn btn-danger btn-sm" onclick="confirmDelete(${s.id})"><i class="fas fa-trash"></i></button>
        <button class="btn btn-gold btn-sm" onclick="saveSectionById(${s.id})"><i class="fas fa-save"></i> Save Section</button>
      </div>
    </div>

    <div class="field-grid">
      <div class="fgroup">
        <label>Title</label>
        <input type="text" id="f-title">
      </div>
      <div class="fgroup">
        <label>Subtitle</label>
        <input type="text" id="f-subtitle">
      </div>
    </div>

    <div class="fgroup mb">
      <label>Body Content</label>
      <div id="quill-body"></div>
    </div>

    <div class="field-grid">
      <div class="fgroup">
        <label>Button 1 Text</label>
        <input type="text" id="f-btn-text" placeholder="e.g. Learn More">
      </div>
      <div class="fgroup">
        <label>Button 1 URL</label>
        <input type="text" id="f-btn-url" placeholder="/about/">
      </div>
      <div class="fgroup">
        <label>Button 2 Text <span class="field-hint">optional</span></label>
        <input type="text" id="f-btn2-text" placeholder="e.g. Donate">
      </div>
      <div class="fgroup">
        <label>Button 2 URL</label>
        <input type="text" id="f-btn2-url" placeholder="/give/">
      </div>
    </div>

    <hr class="sec-divider">

    <div class="field-grid">
      <div class="fgroup">
        <label>Section Image</label>
        <div class="img-field-wrap">
          <span id="sec-img-thumb"></span>
          <div class="img-field-controls">
            <label class="img-file-btn">
              <i class="fas fa-upload"></i> Upload Image
              <input type="file" id="f-image" accept="image/*" onchange="previewSectionImage(this)">
            </label>
            <button class="img-remove-link" id="btn-remove-img" onclick="removeSectionImage()" style="display:none">Remove image</button>
          </div>
        </div>
      </div>
      <div class="fgroup">
        <label>Image Position</label>
        <select id="f-img-pos">
          ${IMG_POSITIONS.map(p => `<option value="${p.val}">${p.label}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="fgroup mb">
      <label>Background</label>
      <div class="bg-picker" id="bg-picker"></div>
    </div>

    <div class="fgroup mb">
      <label>CSS Class <span class="field-hint">extra classes</span></label>
      <input type="text" id="f-css-class" placeholder="optional">
    </div>

    <div class="toggle-row fgroup mb">
      <label>Section Visible</label>
      <label class="toggle">
        <input type="checkbox" id="f-is-visible">
        <span class="toggle-slider"></span>
      </label>
    </div>

    ${ ['accordion', 'stats'].includes(s.section_type) ? `
    <div class="fgroup mb">
      <label>Extra Data <span class="field-hint">JSON — e.g. [{"question":"...","answer":"..."}]</span></label>
      <textarea id="f-extra-data" rows="5" style="font-family:monospace;font-size:.78rem"></textarea>
    </div>` : '' }

    ${ s.section_type === 'cards' ? '<div id="cards-editor"></div>' : '' }
  `;

  // ---- Populate fields safely (no innerHTML) ----
  document.getElementById('f-title').value         = s.title || '';
  document.getElementById('f-subtitle').value      = s.subtitle || '';
  document.getElementById('f-btn-text').value      = s.button_text || '';
  document.getElementById('f-btn-url').value       = s.button_url || '';
  document.getElementById('f-btn2-text').value     = s.button2_text || '';
  document.getElementById('f-btn2-url').value      = s.button2_url || '';
  document.getElementById('f-css-class').value     = s.css_class || '';
  document.getElementById('f-is-visible').checked  = s.is_visible;
  document.getElementById('f-img-pos').value       = s.image_position || 'right';
  if (document.getElementById('f-extra-data'))
    document.getElementById('f-extra-data').value  = s.extra_data || '';

  // ---- Quill ----
  quillInstance = new Quill('#quill-body', {
    theme: 'snow',
    placeholder: 'Write your content here...',
    modules: { toolbar: [
      [{ header: [2, 3, false] }],
      ['bold', 'italic', 'underline'],
      [{ list: 'ordered' }, { list: 'bullet' }],
      ['link', 'blockquote'],
      ['clean'],
    ]},
  });

  // ---- Background picker ----
  const bgPicker = document.getElementById('bg-picker');
  BG_CHOICES.forEach(bg => {
    const lbl = document.createElement('label');
    lbl.className = 'bg-option';
    lbl.title = bg.label;
    lbl.innerHTML = `<input type="radio" name="bg" value="${bg.val}" ${s.background === bg.val ? 'checked' : ''}><span class="bg-swatch bg-swatch-${bg.val}"></span>`;
    bgPicker.appendChild(lbl);
  });

  // ---- Image thumb ----
  const thumb = document.getElementById('sec-img-thumb');
  if (s.image_url) {
    thumb.innerHTML = `<img src="${s.image_url}" class="img-field-thumb" id="img-thumb-el">`;

    thumb.innerHTML = `<div class="img-field-thumb placeholder"><i class="fas fa-image"></i></div>`;

  // ---- Cards editor ----
  if (s.section_type === 'cards') renderCardsEditor(s);

function previewSectionImage(input) {
  if (!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  const thumb = document.getElementById('sec-img-thumb');
  thumb.innerHTML = `<img src="${url}" class="img-field-thumb" id="img-thumb-el">`;
  document.getElementById('btn-remove-img').style.display = 'block';
}

function removeSectionImage() {
  const thumb = document.getElementById('sec-img-thumb');
  thumb.innerHTML = `<div class="img-field-thumb placeholder"><i class="fas fa-image"></i></div>`;
  document.getElementById('btn-remove-img').style.display = 'none';
  document.getElementById('f-image').value = '';
  // Mark for removal on save
  document.getElementById('f-image').dataset.remove = 'true';
}

// ----------------------------------------------------------------
//  Save section
// ----------------------------------------------------------------
function saveSectionById(id) {
  const btn = document.querySelector('#section-editor .btn-gold.btn-sm');
  const origText = btn ? btn.innerHTML : '';
  if (btn) btn.innerHTML = '<i class="fas fa-circle-notch spin"></i> Saving...';

  const fd = new FormData();
  fd.append('title',         document.getElementById('f-title')?.value || '');
  fd.append('subtitle',      document.getElementById('f-subtitle')?.value || '');
  fd.append('body',          quillInstance ? quillInstance.root.innerHTML : '');
  fd.append('button_text',   document.getElementById('f-btn-text')?.value || '');
  fd.append('button_url',    document.getElementById('f-btn-url')?.value || '');
  fd.append('button2_text',  document.getElementById('f-btn2-text')?.value || '');
  fd.append('button2_url',   document.getElementById('f-btn2-url')?.value || '');
  fd.append('css_class',     document.getElementById('f-css-class')?.value || '');
  fd.append('is_visible',    document.getElementById('f-is-visible')?.checked ? 'true' : 'false');
  fd.append('image_position',document.getElementById('f-img-pos')?.value || 'right');

  const bgEl = document.querySelector('input[name="bg"]:checked');
  if (bgEl) fd.append('background', bgEl.value);

  const extraEl = document.getElementById('f-extra-data');
  if (extraEl) fd.append('extra_data', extraEl.value);

  const imgInput = document.getElementById('f-image');
  if (imgInput?.files[0]) {
    fd.append('image', imgInput.files[0]);
  } else if (imgInput?.dataset.remove === 'true') {
    fd.append('remove_image', 'true');
  }

  fetch(`/editor/api/sections/${id}/save/`, {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF },
    body: fd,
  })
  .then(r => r.json())
  .then(data => {
    if (btn) btn.innerHTML = origText;
    if (data.status === 'ok') {
      // Update local state
      const s = sections.find(x => x.id === id);
      if (s) {
        s.title         = document.getElementById('f-title')?.value || s.title;
        s.is_visible    = document.getElementById('f-is-visible')?.checked;
        s.image_url     = data.image_url;
      }
      renderSectionsList();
      toast('Section saved');
    } else {
      toast('Save failed', 'error');
    }
  })
  .catch(() => { if (btn) btn.innerHTML = origText; toast('Save failed', 'error'); });
}

// ----------------------------------------------------------------
//  Toggle visibility
// ----------------------------------------------------------------
function toggleVisibility(id, e) {
  if (e) e.stopPropagation();
  const fd = new FormData();
  fetch(`/editor/api/sections/${id}/toggle/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(data => {
    const s = sections.find(x => x.id === id);
    if (s) s.is_visible = data.is_visible;
    renderSectionsList();
    if (activeSectionId === id && document.getElementById('f-is-visible')) {
      document.getElementById('f-is-visible').checked = data.is_visible;
    }
  });
}

// ----------------------------------------------------------------
//  Delete section
// ----------------------------------------------------------------
function confirmDelete(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Delete this section? This cannot be undone.')) return;
  const fd = new FormData();
  fetch(`/editor/api/sections/${id}/delete/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(() => {
    sections = sections.filter(s => s.id !== id);
    if (activeSectionId === id) {
      activeSectionId = null;
      document.getElementById('section-editor').style.display = 'none';
      document.getElementById('main-empty').style.display = 'flex';
    }
    renderSectionsList();
    toast('Section deleted');
  })
  .catch(() => toast('Delete failed', 'error'));
}

// ----------------------------------------------------------------
//  Add section modal
// ----------------------------------------------------------------
function openAddSection() {
  const grid = document.getElementById('type-grid');
  grid.innerHTML = '';
  SECTION_TYPES.forEach(t => {
    const icon = TYPE_ICONS[t.val] || 'fa-square';
    const color = TYPE_COLORS[t.val] || '#888';
    const el = document.createElement('div');
    el.className = 'type-option';
    el.innerHTML = `
      <div class="to-icon" style="background:${color}20;color:${color}"><i class="fas ${icon}"></i></div>
      <div class="to-label">${t.label}</div>
    `;
    el.addEventListener('click', () => addSection(t.val));
    grid.appendChild(el);
  });
  document.getElementById('modal-add-section').classList.add('open');
}

function closeAddSection(e) {
  if (e.target === e.currentTarget) document.getElementById('modal-add-section').classList.remove('open');
}

function addSection(type) {
  document.getElementById('modal-add-section').classList.remove('open');
  const fd = new FormData();
  fd.append('section_type', type);
  fetch(`/editor/api/pages/${PAGE_ID}/sections/add/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(s => {
    sections.push(s);
    renderSectionsList();
    selectSection(s.id);
    toast(`${s.section_type_display} section added`);
  })
  .catch(() => toast('Failed to add section', 'error'));
}

// ----------------------------------------------------------------
//  Cards editor
// ----------------------------------------------------------------
function renderCardsEditor(s) {
  const container = document.getElementById('cards-editor');
  if (!container) return;
  container.innerHTML = `
    <hr class="sec-divider">
    <div class="cards-section">
      <div class="cards-section-head">
        <h4><i class="fas fa-th-large" style="margin-right:.4rem;opacity:.6"></i> Cards</h4>
        <button class="btn btn-outline btn-sm" onclick="addCard(${s.id})"><i class="fas fa-plus"></i> Add Card</button>
      </div>
      <div id="cards-list-${s.id}"></div>
    </div>
  `;
  renderCardsList(s.id, s.cards || []);
}

function renderCardsList(sectionId, cards) {
  const list = document.getElementById(`cards-list-${sectionId}`);
  if (!list) return;
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = `<p style="font-size:.8rem;color:var(--text-dim);padding:.5rem 0">No cards yet. Click + Add Card.</p>`;
    return;
  }
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card-item';
    el.id = `card-${c.id}`;
    el.innerHTML = `
      <div class="card-item-header" onclick="toggleCardExpand(${c.id})">
        <span>${esc(c.title || 'Card')}</span>
        <div style="display:flex;align-items:center;gap:.5rem">
          <button class="card-delete-btn" onclick="deleteCard(${c.id}, event)"><i class="fas fa-trash"></i></button>
          <button class="card-item-toggle" id="card-chevron-${c.id}"><i class="fas fa-chevron-down"></i></button>
        </div>
      </div>
      <div class="card-item-body" id="card-body-${c.id}">
        <div class="field-grid">
          <div class="fgroup">
            <label>Title</label>
            <input type="text" id="cc-title-${c.id}" value="${esc(c.title)}">
          </div>
          <div class="fgroup">
            <label>Icon <span class="field-hint">fa class</span></label>
            <input type="text" id="cc-icon-${c.id}" value="${esc(c.icon)}" placeholder="fas fa-cross">
          </div>
          <div class="fgroup field-full">
            <label>Description</label>
            <textarea id="cc-body-${c.id}" rows="2">${esc(c.body)}</textarea>
          </div>
          <div class="fgroup">
            <label>Link Text</label>
            <input type="text" id="cc-ltext-${c.id}" value="${esc(c.link_text)}" placeholder="Learn More">
          </div>
          <div class="fgroup">
            <label>Link URL</label>
            <input type="text" id="cc-lurl-${c.id}" value="${esc(c.link_url)}" placeholder="/about/">
          </div>
        </div>
        <div class="fgroup" style="margin-top:.5rem">
          <label>Card Image <span class="field-hint">optional</span></label>
          <div class="img-field-wrap">
            ${c.image_url ? `<img src="${c.image_url}" class="img-field-thumb">` : '<div class="img-field-thumb placeholder"><i class="fas fa-image"></i></div>'}
            <label class="img-file-btn">
              <i class="fas fa-upload"></i> Upload
              <input type="file" accept="image/*" onchange="previewCardImage(this, ${c.id})">
            </label>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:.75rem">
          <button class="btn btn-gold btn-sm" onclick="saveCard(${c.id}, ${sectionId})"><i class="fas fa-save"></i> Save Card</button>
        </div>
      </div>
    `;
    list.appendChild(el);
  });
}

function toggleCardExpand(id) {
  const body = document.getElementById(`card-body-${id}`);
  const chevron = document.getElementById(`card-chevron-${id}`);
  body.classList.toggle('open');
  if (chevron) chevron.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
}

function previewCardImage(input, cardId) {
  if (!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  const wrap = input.closest('.img-field-wrap');
  const thumb = wrap.querySelector('.img-field-thumb, img');
  if (thumb) { thumb.outerHTML = `<img src="${url}" class="img-field-thumb">`; }
}

function addCard(sectionId) {
  const fd = new FormData();
  fetch(`/editor/api/sections/${sectionId}/cards/add/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(card => {
    const s = sections.find(x => x.id === sectionId);
    if (s) { s.cards = s.cards || []; s.cards.push(card); }
    renderCardsEditor(s);
    toast('Card added');
    setTimeout(() => toggleCardExpand(card.id), 50);
  })
  .catch(() => toast('Failed to add card', 'error'));
}

function saveCard(cardId, sectionId) {
  const fd = new FormData();
  fd.append('title',     document.getElementById(`cc-title-${cardId}`)?.value || '');
  fd.append('body',      document.getElementById(`cc-body-${cardId}`)?.value || '');
  fd.append('icon',      document.getElementById(`cc-icon-${cardId}`)?.value || '');
  fd.append('link_text', document.getElementById(`cc-ltext-${cardId}`)?.value || '');
  fd.append('link_url',  document.getElementById(`cc-lurl-${cardId}`)?.value || '');
  const imgInput = document.querySelector(`#card-${cardId} input[type=file]`);
  if (imgInput?.files[0]) fd.append('image', imgInput.files[0]);

  fetch(`/editor/api/cards/${cardId}/save/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'ok') {
      const s = sections.find(x => x.id === sectionId);
      const c = s?.cards?.find(x => x.id === cardId);
      if (c) {
        c.title = document.getElementById(`cc-title-${cardId}`)?.value || c.title;
        if (data.image_url) c.image_url = data.image_url;
      }
      // Update card header title
      const header = document.querySelector(`#card-${cardId} .card-item-header span`);
      if (header) header.textContent = document.getElementById(`cc-title-${cardId}`)?.value || 'Card';
      toast('Card saved');
    }
  })
  .catch(() => toast('Card save failed', 'error'));
}

function deleteCard(cardId, e) {
  e.stopPropagation();
  if (!confirm('Delete this card?')) return;
  const fd = new FormData();
  fetch(`/editor/api/cards/${cardId}/delete/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(() => {
    sections.forEach(s => { if (s.cards) s.cards = s.cards.filter(c => c.id !== cardId); });
    document.getElementById(`card-${cardId}`)?.remove();
    toast('Card deleted');
  })
  .catch(() => toast('Delete failed', 'error'));
}

// ----------------------------------------------------------------
//  Page settings
// ----------------------------------------------------------------
function previewSettingsImage(input) {
  if (!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  const area = document.getElementById('ps-img-area');
  area.innerHTML = `
    <img src="${url}" id="ps-img-preview" alt="" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;display:block">
    <input type="file" id="ps-header-image" accept="image/*" onchange="previewSettingsImage(this)">
    <button class="img-remove-btn" onclick="removePageHeaderImage()">Remove image</button>
  `;
}

function removePageHeaderImage() {
  const area = document.getElementById('ps-img-area');
  area.innerHTML = `
    <input type="file" id="ps-header-image" accept="image/*" onchange="previewSettingsImage(this)">
    <div class="img-upload-placeholder"><i class="fas fa-image"></i><span>Click to upload banner image</span></div>
  `;
}

function savePageSettings() {
  const fd = new FormData();
  fd.append('title',            document.getElementById('ps-title').value);
  fd.append('nav_label',        document.getElementById('ps-nav-label').value);
  fd.append('slug',             document.getElementById('ps-slug').value);
  fd.append('meta_description', document.getElementById('ps-meta').value);
  fd.append('is_published',     isPublished ? 'true' : 'false');
  fd.append('show_in_nav',      document.getElementById('ps-show-nav').checked ? 'true' : 'false');
  fd.append('nav_order',        document.getElementById('ps-nav-order').value);
  const imgInput = document.getElementById('ps-header-image');
  if (imgInput?.files[0]) fd.append('header_image', imgInput.files[0]);

  fetch(`/editor/api/pages/${PAGE_ID}/save/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'ok') {
      document.getElementById('topbar-title').textContent = document.getElementById('ps-title').value;
      document.getElementById('ps-slug').value = data.slug;
      toast('Page settings saved');
    }
  })
  .catch(() => toast('Save failed', 'error'));
}

function togglePublish() {
  isPublished = !isPublished;
  const btn = document.getElementById('btn-publish');
  if (isPublished) {
    btn.className = 'btn btn-publish btn-sm';
    btn.innerHTML = '<i class="fas fa-circle" style="font-size:.5rem"></i> Published';
  } else {
    btn.className = 'btn btn-draft btn-sm';
    btn.innerHTML = '<i class="fas fa-circle" style="font-size:.5rem"></i> Draft';
  }
  const fd = new FormData();
  fd.append('is_published', isPublished ? 'true' : 'false');
  fetch(`/editor/api/pages/${PAGE_ID}/save/`, {
    method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd,
  }).catch(() => {});
}

// ----------------------------------------------------------------
//  Utilities
// ----------------------------------------------------------------
function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// ----------------------------------------------------------------
//  Init
// ----------------------------------------------------------------
renderSectionsList();

// Keyboard shortcut: Ctrl/Cmd+S → save
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrentSection();
  }
});
</script>
